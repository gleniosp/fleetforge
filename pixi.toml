[workspace]
name = "fleetforge"
license = "Apache-2.0"
license-file = "LICENSE"
channels = ["conda-forge", "https://prefix.dev/github-releases"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
requires-pixi = ">=0.83.0"

# Shared compiler tools; device commands are explicitly named and Linux-only.
[dependencies]
rust = "=1.98.1"

[target.linux-64.tasks]
device-build = { depends-on = ["agent-build"] }
agent-build = "cargo build --locked -p fleetforge-agent"
agent-run = "cargo run --locked -p fleetforge-agent --"

[target.linux-64.tasks.device-clean]
cmd = ["sh", "-eu", "-c", '''if test -L target; then
    echo 'Refusing to clean symlinked target/' >&2
    exit 1
fi
exec cargo --config 'build.build-dir="target"' clean --locked --target-dir target
''']

[feature.lint.dependencies]
prek = "=0.5.7"
commitizen = "=4.19.2"
dprint = { version = "=0.63.0", channel = "https://prefix.dev/github-releases" }

[feature.lint.tasks]
setup = { depends-on = [
  "format-setup",
  "hooks-install",
], description = "Prepare the pinned formatter plugin and install Git hooks" }
check = { depends-on = [
  "format-check",
  "hooks-validate",
], description = "Run host source/configuration checks directly; no device checks/tests" }
fix = { depends-on = ["format"], description = "Apply host formatting fixes across the repository" }
format-setup = "dprint install"
format = "dprint fmt --allow-no-files --"
format-check = "dprint check --allow-no-files --"
hooks-install = "prek install"
hooks-validate = "prek validate-config prek.toml"
commit-check = "cz check --commit-msg-file"
commit-check-range = "cz check --rev-range"

[feature.lint.target.linux-64.tasks]
device-check = { depends-on = ["device-format-check", "device-lint"] }
device-format-check = { depends-on = ["agent-format-check"] }
device-format = { depends-on = ["agent-format"] }
device-lint = { depends-on = ["agent-lint"] }
device-fix = { depends-on = ["agent-fix"] }
agent-check = { depends-on = ["agent-format-check", "agent-lint"] }
agent-format-check = "cargo fmt -p fleetforge-agent -- --check"
agent-format = "cargo fmt -p fleetforge-agent"
agent-lint = "cargo clippy --locked -p fleetforge-agent --all-targets -- -D warnings"
agent-fix = "cargo clippy --fix --locked -p fleetforge-agent --all-targets -- -D warnings"

# Cargo supplies test execution; no additional test package is needed.
[feature.test]
# No host test suite exists yet; add real test tasks with host components.

[feature.test.target.linux-64.tasks]
device-test = { depends-on = ["agent-test"] }
agent-test = "cargo test --locked -p fleetforge-agent"

[environments]
default = { solve-group = "toolchain" }
host = { features = ["lint", "test"], solve-group = "toolchain" }
device = { features = ["lint", "test"], platforms = ["linux-64"], solve-group = "toolchain" }
