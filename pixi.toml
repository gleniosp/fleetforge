[workspace]
name = "fleetforge"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0,<0.83"

[dependencies]
# Includes Cargo, rustfmt, Clippy and the native Linux linker dependencies.
rust = "=1.98.1"

[tasks]
# Build/run tasks belong to the default feature, inherited by dev.
build = { depends-on = [{ task = "rust-build", environment = "default" }], description = "Build all implemented components" }
clean = { depends-on = [{ task = "rust-clean", environment = "default" }], description = "Remove only repository target/ build output" }
rust-build = { cmd = "cargo build --workspace --locked", default-environment = "default", description = "Build the Rust workspace in the default environment" }
agent-run = { cmd = "cargo run --locked -p fleetforge-agent --", default-environment = "default", description = "Build and run the agent bootstrap CLI; forward arguments to the executable" }

[tasks.rust-clean]
cmd = ["sh", "-eu", "-c", '''
if test -L target; then
    echo 'Refusing to clean symlinked target/' >&2
    exit 1
fi
exec cargo --config 'build.build-dir="target"' clean --locked --target-dir target
''']
default-environment = "default"
description = "Clean fixed repository target/; refuse a symlink"

[feature.test.tasks]
# Cargo supplies Rust test support; no additional test package is needed.
test = { depends-on = ["rust-test"], description = "Run all implemented component tests" }
rust-test = { cmd = "cargo test --workspace --locked", description = "Run workspace unit, integration and documentation tests" }

[feature.lint.dependencies]
prek = "=0.5.6"
commitizen = "=4.19.2"

[feature.lint.tasks]
# rustfmt and Clippy are already included in the default Rust package.
lint = { depends-on = ["rust-lint"], description = "Lint all implemented components" }
format = { depends-on = ["rust-format"], description = "Rewrite source formatting; review the resulting diff" }
format-check = { depends-on = ["rust-format-check"], description = "Check source formatting without rewriting files" }
fix = { depends-on = ["rust-fix"], description = "Apply lint suggestions with Cargo's Git safety checks" }
rust-lint = { cmd = "cargo clippy --workspace --all-targets --locked -- -D warnings", description = "Run Clippy on all workspace targets, denying warnings" }
rust-format = { cmd = "cargo fmt --all", description = "Format all workspace Rust source with rustfmt" }
rust-format-check = { cmd = "cargo fmt --all -- --check", description = "Check all workspace Rust source with rustfmt" }
rust-fix = { cmd = "cargo clippy --fix --workspace --all-targets --locked -- -D warnings", description = "Apply Clippy/compiler suggestions; refuse dirty or staged work" }

[environments]
# Declare default only to keep shared package versions aligned with dev.
default = { solve-group = "toolchain" }

[environments.dev]
features = ["test", "lint"]
solve-group = "toolchain"

[environments.dev.tasks]
# Aggregates belong to the environment that composes both checking features.
check = { depends-on = ["rust-check"], description = "Check all implemented components without rewriting source or locks" }
rust-check = { depends-on = ["rust-format-check", "rust-lint", "rust-test"], description = "Check Rust formatting, lints and tests" }
