[workspace]
name = "fleetforge"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0,<0.83"

[feature.rust.dependencies]
# Includes Cargo, rustfmt, Clippy and the native Linux linker dependencies.
rust = "=1.98.1"

[tasks]
# Aliases run no tools in the empty default environment; dependencies pin the
# environment that actually executes each command.
check = { depends-on = ["rust-check"], description = "Check all implemented components without rewriting source or locks" }
lint = { depends-on = [{ task = "rust-lint", environment = "dev" }], description = "Lint all implemented components" }
format = { depends-on = [{ task = "rust-format", environment = "dev" }], description = "Rewrite source formatting; review the resulting diff" }
format-check = { depends-on = [{ task = "rust-format-check", environment = "dev" }], description = "Check source formatting without rewriting files" }
fix = { depends-on = [{ task = "rust-fix", environment = "dev" }], description = "Apply lint suggestions with Cargo's Git safety checks" }
test = { depends-on = [{ task = "rust-test", environment = "dev" }], description = "Run all implemented component tests" }
build = { depends-on = [{ task = "rust-build", environment = "build" }], description = "Build all implemented components" }
clean = { depends-on = [{ task = "rust-clean", environment = "build" }], description = "Remove only repository target/ build output" }

rust-check = { depends-on = [{ task = "rust-format-check", environment = "dev" }, { task = "rust-lint", environment = "dev" }, { task = "rust-test", environment = "dev" }], description = "Check Rust formatting, lints and tests" }

[feature.rust.tasks]
# Defaults select the toolchain for direct component task invocation.
rust-lint = { cmd = "cargo clippy --workspace --all-targets --locked -- -D warnings", default-environment = "dev", description = "Run Clippy on all workspace targets, denying warnings" }
rust-format = { cmd = "cargo fmt --all", default-environment = "dev", description = "Format all workspace Rust source with rustfmt" }
rust-format-check = { cmd = "cargo fmt --all -- --check", default-environment = "dev", description = "Check all workspace Rust source with rustfmt" }
rust-fix = { cmd = "cargo clippy --fix --workspace --all-targets --locked -- -D warnings", default-environment = "dev", description = "Apply Clippy/compiler suggestions; refuse dirty or staged work" }
rust-test = { cmd = "cargo test --workspace --locked", default-environment = "dev", description = "Run workspace unit, integration and documentation tests" }
rust-build = { cmd = "cargo build --workspace --locked", default-environment = "build", description = "Build the Rust workspace in the build environment" }
agent-run = { cmd = "cargo run --locked -p fleetforge-agent --", default-environment = "build", description = "Build and run the agent bootstrap CLI; forward arguments to the executable" }

[feature.rust.tasks.rust-clean]
cmd = ["sh", "-eu", "-c", '''
if test -L target; then
    echo 'Refusing to clean symlinked target/' >&2
    exit 1
fi
exec cargo --config 'build.build-dir="target"' clean --locked --target-dir target
''']
default-environment = "build"
description = "Clean fixed repository target/; refuse a symlink"

[feature.development.dependencies]
prek = "=0.5.6"
commitizen = "=4.19.2"

[environments]
# Select dev or build explicitly; Pixi's implicit default feature stays empty.
dev = { features = ["rust", "development"], solve-group = "toolchain", no-default-feature = true }
build = { features = ["rust"], solve-group = "toolchain", no-default-feature = true }
