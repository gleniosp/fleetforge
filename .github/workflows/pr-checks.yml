name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  host-checks:
    name: Host checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked Pixi environments
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: host default
          locked: true
          cache: false

      - name: Set up contributor hooks
        run: pixi run --locked -e host setup

      - name: Check proposed commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pixi run --locked -e host commit-check-range "$PR_BASE..$PR_HEAD"

      - name: Check contributor configuration and formatting
        run: pixi run --locked -e host check

      - name: Run portable Python fixture tests
        run: pixi run --locked -e host test

      - name: Check commit safety without applying fixes
        run: pixi run --locked -e host prek run --all-files --stage pre-commit --skip fix

      - name: Check tracked-file stability
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  device-checks:
    name: Device checks (linux-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked device build/check tools
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: device
          locked: true
          cache: false
      - name: Check device formatting and lints
        run: pixi run --locked -e device device-check
      - name: Run device tests
        run: pixi run --locked -e device device-test
      - name: Build device executable
        run: pixi run --locked -e device device-build
      - name: Check tracked-file stability
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  checks:
    name: Repository checks
    needs: [host-checks, device-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every developer host
        env:
          DEVICE_RESULT: ${{ needs.device-checks.result }}
          HOST_RESULT: ${{ needs.host-checks.result }}
        run: test "$HOST_RESULT" = success && test "$DEVICE_RESULT" = success
