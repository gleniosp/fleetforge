minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-commit", "commit-msg"]

default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer", args = ["--check"] },
  { id = "trailing-whitespace", args = ["--check", "--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "hooks-validate"
name = "Validate hook configuration"
language = "system"
entry = "pixi run --locked -e host hooks-validate"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "commit-check"
name = "Check Conventional Commit message"
language = "system"
entry = "pixi run --locked -e host commit-check"
stages = ["commit-msg"]
