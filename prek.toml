minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-commit", "commit-msg"]

default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "fix"
name = "Apply repository fixes"
language = "system"
entry = "pixi run --locked -e host fix"
always_run = true
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "commit-check"
name = "Check Conventional Commit message"
language = "system"
entry = "pixi run --locked -e host commit-check"
stages = ["commit-msg"]
