minimum_prek_version = "0.5.6"
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check"
name = "Check repository"
language = "system"
entry = "pixi run --locked -e dev check"
stages = ["pre-commit"]
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "commit-check"
name = "Check Conventional Commit message"
language = "system"
entry = "pixi run --locked -e dev commit-check"
stages = ["commit-msg"]
